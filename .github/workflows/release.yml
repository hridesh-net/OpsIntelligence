name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      # Pre-release tags (e.g. v3.10.6-beta.1, v4.0.0-rc.1)
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
            # Use MSVC for the Rust subprocess (no MSYS2 dependency on the
            # cargo side). The Go binary still uses mingw/CGO; that's fine
            # because the Rust binary is launched as a separate process.
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node.js (for dashboard UI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            internal/webui/dashboard/ui/package-lock.json
            scrun/package-lock.json

      - name: Build dashboard UI (Vite → //go:embed assets)
        shell: bash
        run: |
          cd internal/webui/dashboard/ui
          npm ci --no-audit --no-fund
          npm run build
          # Sanity check: the hashed bundle must be present before `go build`
          # runs //go:embed, otherwise the binary ships a stale dashboard.
          ls -la ../assets/
          ls -la ../assets/assets/

      - name: Build Scrun React app (Vite → //go:embed assets/scrun)
        shell: bash
        run: |
          cd scrun
          npm ci --no-audit --no-fund
          npm run build
          # Sanity check: the Scrun bundle must be present before `go build`.
          ls -la ../internal/webui/dashboard/assets/scrun/
          ls -la ../internal/webui/dashboard/assets/scrun/assets/

      - name: Setup Rust (with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust_target }}-cargo-

      - name: Install MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Install Linux dependencies
        if: matrix.target == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Install ARM64 cross-compiler (Go + Rust)
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # tell Rust which linker to use for the aarch64-linux target
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build Rust TUI (${{ matrix.rust_target }})
        shell: bash
        run: |
          cargo build --release -p opsintel-tui --target ${{ matrix.rust_target }}
          mkdir -p internal/tuibridge/assets
          BIN_NAME="opsintel-tui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp "target/${{ matrix.rust_target }}/release/opsintel-tui.exe" "internal/tuibridge/assets/${BIN_NAME}"
          else
            cp "target/${{ matrix.rust_target }}/release/opsintel-tui" "internal/tuibridge/assets/${BIN_NAME}"
          fi
          ls -la internal/tuibridge/assets/

      - name: Build Binary (Native)
        if: matrix.target != 'linux-arm64'
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.os == 'windows-latest' && 'gcc' || '' }}
        run: |
          mkdir -p dist
          go build -mod=vendor -tags fts5,opsintelligence_localgemma -ldflags "-X main.version=${{ github.ref_name }} -s -w" -o dist/opsintelligence-${{ matrix.target }}${{ matrix.ext }} ./cmd/opsintelligence

      - name: Build Binary (Linux ARM64 Cross-Compile)
        if: matrix.target == 'linux-arm64'
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
        run: |
          mkdir -p dist
          go build -mod=vendor -tags fts5 -ldflags "-X main.version=${{ github.ref_name }} -s -w" -o dist/opsintelligence-${{ matrix.target }}${{ matrix.ext }} ./cmd/opsintelligence

      - name: Compress binary (gzip) for smaller downloads
        shell: bash
        run: |
          # install.sh prefers the .gz asset (60-70% smaller); the raw
          # binary is kept so older install scripts keep working.
          gzip -9 -k -f dist/opsintelligence-${{ matrix.target }}${{ matrix.ext }}
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin-archives
          merge-multiple: true

      # GitHub REST API rejects release assets > 2 GiB. Default Gemma Q4_K_M GGUF is ~3 GiB,
      # so we do not upload the binary here — only a small mirror manifest (see release/).
      - name: Stage binaries for release
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          cp bin-archives/* dist/ 2>/dev/null || true
          echo "dist contents:"
          ls -la dist/ || true
          bins=(dist/opsintelligence*)
          if [[ ${#bins[@]} -eq 0 ]]; then
            echo "::error::No opsintelligence binaries in dist/ after merging artifacts. Check build job outputs and bin-archives/."
            ls -la bin-archives/ || true
            exit 1
          fi

      - name: Add Gemma mirror manifest to release
        run: |
          cp release/gemma-4-e2b-it-MIRROR_MANIFEST.txt dist/

      - name: Create Release Notes
        id: release_notes
        run: |
          echo "## OpsIntelligence ${GITHUB_REF_NAME}" > release_notes.md
          if echo "${GITHUB_REF_NAME}" | grep -q '-'; then
            echo "**Pre-release (beta / RC).** Not marked stable; expect changes before the final release." >> release_notes.md
          else
            echo "Stable release build." >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "Automated binaries below. Each platform binary embeds the matching" >> release_notes.md
          echo "ratatui-based Rust TUI subprocess (extracted to" >> release_notes.md
          echo "\$XDG_CACHE_HOME/opsintelligence/tui/ on first run)." >> release_notes.md
          echo "" >> release_notes.md
          echo "Included assets:" >> release_notes.md
          echo "- opsintelligence binaries for supported targets" >> release_notes.md
          echo "- gemma-4-e2b-it-MIRROR_MANIFEST.txt (GGUF download URLs — GitHub asset limit 2 GiB; weights ~3 GiB)" >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          # Tags like v1.2.3 are stable; v1.2.3-beta.1 / v1.2.3-rc.1 are pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
